name: TableFlow CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TABLEFLOW_TEST_MYSQL: 'true'
      TABLEFLOW_MYSQL_PASSWORD: tableflow-ci-local-only
      TABLEFLOW_MYSQL_ROOT_PASSWORD: tableflow-ci-root-local-only
      TABLEFLOW_LOAD_ENABLED: 'true'
      TABLEFLOW_LOAD_URL: jdbc:mysql://localhost:3307/tableflow
      TABLEFLOW_LOAD_USER: tableflow
      TABLEFLOW_LOAD_PASSWORD: tableflow-ci-local-only
      TABLEFLOW_LOAD_TABLES: TB_EMPLOYEE
      TABLEFLOW_LOAD_SSL_MODE: REQUIRED
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install and prepare local OCR
        working-directory: ai-service
        run: |
          python -m pip install -r requirements.txt
          python prepare_models.py
      - name: Python mock, boundary and real OCR tests
        working-directory: ai-service
        env:
          TABLEFLOW_TEST_LOCAL_OCR: 'true'
        run: python -m pytest -q
      - name: Start isolated MySQL
        run: docker compose up -d --wait --wait-timeout 180 mysql
      - name: Start state database for tests
        run: docker compose -f infra/state/compose.yml up -d --wait --wait-timeout 180
      - name: Backend tests and executable jar
        working-directory: backend
        run: bash gradlew test bootJar
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Production frontend build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:18080/api/v1
        working-directory: frontend
        run: npm run build
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser workflow tests
        working-directory: frontend
        env:
          TABLEFLOW_TEST_LOCAL_OCR: 'true'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-reports
          path: |
            backend/build/reports/tests/
            frontend/test-results/
  database:
    # 실제 DB 서버(Oracle·PostgreSQL·MySQL·MariaDB)가 필요한 백엔드 통합 테스트와 브라우저 테스트.
    # 컨테이너의 계정·비밀번호는 infra/jdbc/compose.yml의 일회용 루프백 테스트 값이다. SQL Server·CUBRID·Tibero는 제조사 드라이버·환경이 필요해 제외한다.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TABLEFLOW_TEST_JDBC: 'true'
      TABLEFLOW_TEST_JDBC_DBMS: oracle,postgresql,mysql,mariadb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start database test containers
        run: docker compose -f infra/jdbc/compose.yml --profile oracle up -d --wait --wait-timeout 600
      # 새로 만든 Oracle은 앱 계정의 첫 INSERT가 수십 초 걸린다. 테스트 연결의 읽기 제한(10초)에 계속 끊기지 않도록 먼저 한 번 끝낸다.
      - name: Warm up the new Oracle database
        run: |
          printf '%s\n' 'WHENEVER SQLERROR EXIT FAILURE' 'CREATE TABLE tf_warmup (id INTEGER PRIMARY KEY);' 'INSERT INTO tf_warmup VALUES (1);' 'COMMIT;' 'DROP TABLE tf_warmup PURGE;' 'EXIT' \
            | timeout 300 docker exec -i tableflow-jdbc-tests-oracle-1 sqlplus -s tableflow/TableFlowTest2026@//localhost/FREEPDB1
      - name: Start state database for tests
        run: docker compose -f infra/state/compose.yml up -d --wait --wait-timeout 180
      - name: Backend tests against real databases and executable jar
        working-directory: backend
        run: bash gradlew test bootJar
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Production frontend build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:18080/api/v1
        working-directory: frontend
        run: npm run build
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Database browser tests
        working-directory: frontend
        env:
          TABLEFLOW_JDBC_ENABLED: 'true'
          TABLEFLOW_JDBC_LOAD_ENABLED: 'true'
        run: npx playwright test batch.spec.ts database.spec.ts db-to-file.spec.ts migration.spec.ts schedule.spec.ts
      - name: Database container logs
        if: failure()
        run: docker compose -f infra/jdbc/compose.yml --profile oracle logs --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: database-verification-reports
          path: |
            backend/build/reports/tests/
            frontend/test-results/
