services:
  mysql:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: tableflow
      MYSQL_USER: tableflow
      MYSQL_PASSWORD: ${TABLEFLOW_MYSQL_PASSWORD:?Set TABLEFLOW_MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${TABLEFLOW_MYSQL_ROOT_PASSWORD:?Set TABLEFLOW_MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - tableflow-mysql:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/001-tableflow.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
  # TableFlow 서버 상태를 담는 개발용 PostgreSQL. 비밀번호가 비어 있으면 이 서비스만 시작에 실패한다.
  state-db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:15442:5432"
    environment:
      POSTGRES_USER: tableflow
      POSTGRES_PASSWORD: ${TABLEFLOW_STATE_DB_PASSWORD:-}
      POSTGRES_DB: tableflow
    volumes:
      - tableflow-state:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tableflow -d tableflow -h 127.0.0.1"]
      interval: 3s
      retries: 40
volumes:
  tableflow-mysql:
  tableflow-state:
