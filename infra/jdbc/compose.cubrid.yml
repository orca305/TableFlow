# 선택 실행 전용, 기존 프로젝트와 분리된 일회용 루프백 fixture.
name: tableflow-jdbc-tests-cubrid
services:
  cubrid:
    image: cubrid/cubrid:11.3@sha256:66b0adccd2fbbe0600db48eb8e8524d624b02db368d3e1c281597dc7398a042d
    ports: ["127.0.0.1:13300:33000"]
    environment:
      CUBRID_DB: tableflow
      CUBRID_LOCALE: ko_KR.utf8
      CUBRID_USER: tableflow
      CUBRID_PASSWORD: TableFlowTest2026
    healthcheck:
      test: ["CMD-SHELL", "gosu cubrid csql -u tableflow -p TableFlowTest2026 tableflow -c 'SELECT 1;' >/dev/null 2>&1"]
      interval: 5s
      retries: 40
      start_period: 20s
