# 백엔드·브라우저 테스트가 쓰는 일회용 상태 DB. 개발용(루트 compose.yaml의 state-db, 15442)과 분리한다.
# 공개된 비밀번호는 이 빈 루프백 전용 컨테이너에만 쓴다. 운영·개인 DB로 바꾸지 마세요.
name: tableflow-state-tests
services:
  postgresql:
    image: postgres:17-alpine
    ports: ["127.0.0.1:15443:5432"]
    environment:
      POSTGRES_USER: tableflow
      POSTGRES_PASSWORD: TableFlowTest2026
      POSTGRES_DB: tableflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tableflow -d tableflow -h 127.0.0.1"]
      interval: 3s
      retries: 40
