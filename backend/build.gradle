plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.tableflow'
version = '0.1.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc' // 상태 DB(PostgreSQL) 접근
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'com.mysql:mysql-connector-j:9.7.0'
    implementation 'org.postgresql:postgresql:42.7.14'
    implementation 'org.mariadb.jdbc:mariadb-java-client:4.0.0'
    implementation 'com.oracle.database.jdbc:ojdbc11:23.26.4.0.0'
    implementation 'org.apache.poi:poi-ooxml:6.0.0'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation('org.apache.pdfbox:pdfbox:3.0.8') {
        exclude group: 'commons-logging', module: 'commons-logging' // Spring JCL supplies the logging API.
    }
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.h2database:h2' // DB→File 추출 로직의 실제 JDBC 동작 검증용(대상 DBMS 아님)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') {
    useJUnitPlatform()
    def integrationFlags = ['TABLEFLOW_TEST_JDBC', 'TABLEFLOW_TEST_SQLSERVER', 'TABLEFLOW_TEST_CUBRID', 'TABLEFLOW_TEST_TIBERO', 'TABLEFLOW_TEST_MYSQL']
    integrationFlags.each { flag -> inputs.property(flag, System.getenv(flag) ?: 'false') }
    inputs.property('TABLEFLOW_TEST_JDBC_DBMS', System.getenv('TABLEFLOW_TEST_JDBC_DBMS') ?: '')
    // 외부 DB 상태는 Gradle 입력 파일에 포함되지 않는다. 실제 DB 검증은 이전 결과를 재사용하지 않는다.
    outputs.upToDateWhen { !integrationFlags.any { System.getenv(it) == 'true' } }
    // 모든 Spring 테스트는 전용 상태 DB(infra/state/compose.yml)가 필요하다. 환경 변수로 바꿀 수 있다.
    def stateDb = [TABLEFLOW_STATE_DB_URL: 'jdbc:postgresql://127.0.0.1:15443/tableflow', TABLEFLOW_STATE_DB_USER: 'tableflow', TABLEFLOW_STATE_DB_PASSWORD: 'TableFlowTest2026']
    stateDb.each { name, fallback -> environment name, System.getenv(name) ?: fallback }
    inputs.property('TABLEFLOW_STATE_DB_URL', System.getenv('TABLEFLOW_STATE_DB_URL') ?: '')
    systemProperty 'tableflow.history.file', "${buildDir}/tmp/test-history.jsonl" // 테스트가 data/ 이력을 오염시키지 않도록
}
