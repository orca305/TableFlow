plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.tableflow'
version = '0.1.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'com.mysql:mysql-connector-j:9.7.0'
    implementation 'org.postgresql:postgresql:42.7.14'
    implementation 'org.mariadb.jdbc:mariadb-java-client:4.0.0'
    implementation 'com.oracle.database.jdbc:ojdbc11:23.26.4.0.0'
    implementation 'org.apache.poi:poi-ooxml:6.0.0'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation('org.apache.pdfbox:pdfbox:3.0.8') {
        exclude group: 'commons-logging', module: 'commons-logging' // Spring JCL supplies the logging API.
    }
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform() }
