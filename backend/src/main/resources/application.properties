spring.application.name=tableflow
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.tomcat.max-http-form-post-size=11MB
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
tableflow.frontend-origin=${TABLEFLOW_FRONTEND_ORIGIN:http://localhost:3100}
# 서버 상태를 담는 전용 PostgreSQL(필수, 기본값 없음). 이관 원본·대상 접속과 별개이며 비밀번호는 환경 변수로만 넣는다.
tableflow.state-db.url=${TABLEFLOW_STATE_DB_URL:}
tableflow.state-db.user=${TABLEFLOW_STATE_DB_USER:}
tableflow.state-db.password=${TABLEFLOW_STATE_DB_PASSWORD:}
tableflow.state-db.schema=${TABLEFLOW_STATE_DB_SCHEMA:tableflow}
spring.flyway.default-schema=${tableflow.state-db.schema}
spring.flyway.schemas=${tableflow.state-db.schema}
# 접속 주소(IP)당 1분에 받는 POST 요청 수. 넘으면 429를 돌려준다.
tableflow.api.posts-per-minute=${TABLEFLOW_POSTS_PER_MINUTE:120}
tableflow.ocr-url=${TABLEFLOW_OCR_URL:http://127.0.0.1:8000}
tableflow.ocr-timeout-seconds=${TABLEFLOW_OCR_TIMEOUT_SECONDS:45}
tableflow.load.enabled=${TABLEFLOW_LOAD_ENABLED:false}
tableflow.load.url=${TABLEFLOW_LOAD_URL:}
tableflow.load.user=${TABLEFLOW_LOAD_USER:}
tableflow.load.password=${TABLEFLOW_LOAD_PASSWORD:}
tableflow.load.tables=${TABLEFLOW_LOAD_TABLES:}
tableflow.load.ssl-mode=${TABLEFLOW_LOAD_SSL_MODE:VERIFY_IDENTITY}

# Metadata-only JDBC explorer: local opt-in, no passwords persisted.
tableflow.jdbc.enabled=${TABLEFLOW_JDBC_ENABLED:false}
tableflow.jdbc.allowed-hosts=${TABLEFLOW_JDBC_ALLOWED_HOSTS:localhost,127.0.0.1}

tableflow.jdbc.load-enabled=${TABLEFLOW_JDBC_LOAD_ENABLED:false}

# 이관 작업 상태는 상태 DB에 둔다. 실행 중인 서버가 간격마다 생존 신호를 남기고, 만료 시간 동안 신호가 없으면 중단된 것으로 본다(만료 ≥ 간격×2, 같은 상태 DB를 쓰는 서버는 같은 값).
tableflow.jobs.heartbeat-seconds=${TABLEFLOW_JOBS_HEARTBEAT_SECONDS:10}
tableflow.jobs.lease-seconds=${TABLEFLOW_JOBS_LEASE_SECONDS:60}

# 저장된 DB 연결. 비밀번호는 사용자가 저장을 선택한 연결만 AES-256-GCM으로 암호화해 로컬 파일에 보관한다(브라우저로 반환하지 않음).
tableflow.connections.enabled=${TABLEFLOW_CONNECTIONS_ENABLED:true}
tableflow.connections.save-password=${TABLEFLOW_CONNECTIONS_SAVE_PASSWORD:true}
tableflow.connections.file=${TABLEFLOW_CONNECTIONS_FILE:data/connections.json}
tableflow.connections.key-file=${TABLEFLOW_CONNECTIONS_KEY_FILE:data/connections.key}
tableflow.connections.secret-key=${TABLEFLOW_SECRET_KEY:}

# 등록 API는 32자 이상 관리자 키를 설정한 로컬 관리자에게만 허용
tableflow.drivers.admin-key=${TABLEFLOW_DRIVERS_ADMIN_KEY:}
tableflow.drivers.directory=${TABLEFLOW_DRIVERS_DIRECTORY:data/drivers}

# 선택 JDBC 드라이버: SQL Server/CUBRID는 관리자 반입 JAR가 필요함. Tibero는 검증 전 기본 비활성화
tableflow.jdbc.sqlserver-enabled=${TABLEFLOW_SQLSERVER_ENABLED:true}

tableflow.jdbc.tibero-enabled=${TABLEFLOW_TIBERO_ENABLED:false}
tableflow.jdbc.cubrid-enabled=${TABLEFLOW_CUBRID_ENABLED:true}
